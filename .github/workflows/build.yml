name: Rabbit3D Viewer Build (Debug APK + Play Store AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release-key.jks ] || ! keytool -list -keystore app/release-key.jks -storepass Rabbit3DPass2026 -alias rabbit3d >/dev/null 2>&1; then
            rm -f app/release-key.jks
            keytool -genkeypair -v \
              -keystore app/release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias rabbit3d \
              -storepass Rabbit3DPass2026 \
              -keypass Rabbit3DPass2026 \
              -dname "CN=Rabbit3D Viewer, OU=Mobile 3D Engineering, O=Rabbit3D, L=Madrid, ST=Madrid, C=ES"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release AAB for Google Play Store
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Rabbit3DPass2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'rabbit3d' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Rabbit3DPass2026' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabbit3D-Viewer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Play Store Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabbit3D-Viewer-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
